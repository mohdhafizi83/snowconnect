name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes from CHANGELOG
        run: |
          TAG=${GITHUB_REF_NAME}
          VER=${GITHUB_REF_NAME#v}   # CHANGELOG guna [1.2.3] tanpa 'v'
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$VER" -v tagv="$TAG" '
              ($0 ~ "## \\[" tagv || $0 ~ "## \\[" tag) {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md > release_notes.md
            [ -s release_notes.md ] || echo "Release $TAG" > release_notes.md
          else
            echo "Release $TAG" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: true

  # Build & push the demo image to GHCR on every v* tag.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
